  project:
    name: "Construtora Horizonte"
    slug: "construtora-horizonte"
    type: "institutional"
    site_structure: "multi_page"
    description: "Site institucional para construtora residencial de medio padrao em Goiania-GO."
    language:
      primary: "pt-BR"
      secondary: []
    objective:
      primary: "Gerar contato/orcamento (via formulario e WhatsApp)"
      secondary: ["Mostrar portfolio de projetos", "Transmitir credibilidade institucional"]
    audience:
      description: "Pessoas buscando construir ou reformar um imovel residencial na regiao de Goiania"
    reference_files:
      - "examples/construtora-horizonte/reference.png"

  requirements:
    functional:
      - { id: RF01, description: "Formulario de contato envia solicitacao", priority: high, source: layout, status: approved }
      - { id: RF02, description: "Botao de WhatsApp leva direto para conversa", priority: high, source: layout, status: approved }
      - { id: RF03, description: "Listagem de projetos filtravel por categoria", priority: medium, source: layout, status: approved }
    technical: []
    business: []
    content: []

  design:
    colors:
      primary: { value: "#C9872E (dourado/laranja queimado dos CTAs)", confidence: high, evidence: visual }
      secondary: { value: "#14171C (preto/grafite de headers escuros e footer)", confidence: high, evidence: visual }
      background: { value: "#FFFFFF e tons neutros claros", confidence: high, evidence: visual }
    typography:
      heading: { value: "Sans-serif grotesca, peso bold, caixa alta em labels de categoria", confidence: medium, evidence: visual }
    style: { value: "Institucional, fotografia de arquitetura de alto contraste, cantos levemente arredondados em cards e botoes", confidence: medium, evidence: visual }
    icon_library: "Phosphor (regular) - tracos finos como os icones de casa/ferramenta/planta dos cards"
    tokens:
      # Cores MEDIDAS por mediana de pixels em regioes da reference.png
      # (2026-11-11). A estimativa anterior (#C9872E) estava errada.
      color:
        primary: { value: "#AA762A", confidence: high, evidence: visual }
        primary_dark: { value: "#94612D", confidence: high, evidence: visual }
        secondary: { value: "#15181B", confidence: high, evidence: visual }
        background: { value: "#FDFDFB", confidence: high, evidence: visual }
        surface: { value: "#FFFFFF", confidence: medium, evidence: visual }
        chip: { value: "#ECEBE7", confidence: high, evidence: visual }
        border: { value: "#ECEAE6", confidence: medium, evidence: visual }
        text: { value: "#15181B", confidence: high, evidence: visual }
        text_muted: { value: "#6B6E70", confidence: medium, evidence: visual }
        whatsapp: { value: "#0E9047", confidence: high, evidence: visual }
        overlay: { value: "rgba(13, 22, 38, 0.72)", confidence: medium, evidence: visual }
      font_family:
        heading: { value: "'Manrope', sans-serif", confidence: low, evidence: inference }
        body: { value: "'Inter', sans-serif", confidence: low, evidence: inference }
      # Remedido na rodada 2 do QA: a escala da referencia e ~30% maior que a
      # estimada na v0.2 inicial (coluna de 589px = 1440px, fator ~2,44).
      font_size:
        hero: "clamp(3rem, 5.6vw, 5rem)"
        page_hero: "clamp(2.75rem, 5vw, 4.75rem)"
        h2: "clamp(2.1rem, 3.6vw, 3.4rem)"
        h3: "1.625rem"
        eyebrow: "1rem"
        lead: "1.4375rem"
        body: "1.3125rem"
        small: "1.1875rem"
      font_weight: { heading: 700, body: 400, eyebrow: 700 }
      line_height: { heading: 1.1, body: 1.6 }
      space: { xs: "8px", sm: "16px", md: "24px", lg: "48px", xl: "96px" }
      radius: { sm: "6px", md: "10px", pill: "999px" }
      shadow:
        card: { value: "0 6px 24px rgba(21, 24, 27, 0.06)", confidence: low, evidence: visual }
      layout: { container_max: "1280px", gutter: "40px" }

