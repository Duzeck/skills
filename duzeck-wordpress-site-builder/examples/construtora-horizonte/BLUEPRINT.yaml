  # Onde cada parte visivel e editada no admin (schema 1.2). Nada visivel
  # fica fixo no template: toda secao, header e footer tem um destino aqui.
  editable_content:
    - { target: header, where: "Configurações do Site > Empresa/Cabeçalho; Aparência > Menus", storage: options_page, fields: [company_logo_light, company_logo_dark, header_cta_label, header_cta_page] }
    - { target: footer, where: "Configurações do Site > Rodapé/Empresa/Redes sociais; menu Links Rápidos", storage: options_page, fields: [footer_text, footer_links_title, footer_services_title, footer_contact_title, footer_copyright, footer_privacy_label, footer_privacy_url, footer_terms_label, footer_terms_url] }
    - { target: home_hero, where: "Páginas > Início > Hero", storage: page_fields, fields: [home_hero_eyebrow, home_hero_title, home_hero_text, home_hero_image, home_hero_primary_label, home_hero_primary_page, home_hero_secondary_label] }
    - { target: home_services, where: "Páginas > Início > Serviços; cards em Serviços", storage: page_fields, fields: [home_services_eyebrow, home_services_title, home_services_text, home_services_link_label] }
    - { target: home_about, where: "Páginas > Início > Sobre", storage: page_fields, fields: [about_eyebrow, about_title, about_text, about_image, about_stats, about_button_label, about_button_page] }
    - { target: home_projects, where: "Páginas > Início > Projetos; cards em Projetos", storage: page_fields, fields: [home_projects_eyebrow, home_projects_title, home_projects_text, home_projects_count, home_projects_button_label] }
    - { target: home_testimonials, where: "Páginas > Início > Depoimentos; cards em Depoimentos", storage: page_fields, fields: [home_testimonials_eyebrow, home_testimonials_title] }
    - { target: home_cta, where: "Configurações do Site > Chamada final", storage: options_page, fields: [cta_title, cta_text, cta_background, cta_primary_label, cta_primary_page, cta_whatsapp_label] }
    - { target: about_hero, where: "Páginas > Sobre > Cabeçalho da página", storage: page_fields, fields: [page_hero_title, page_hero_text, page_hero_image] }
    - { target: about_content, where: "Páginas > Sobre > editor; bloco Sobre em Páginas > Início > Sobre", storage: editor }
    - { target: services_hero, where: "Configurações do Site > Serviços e Projetos", storage: options_page, fields: [services_hero_title, services_hero_text, services_hero_image] }
    - { target: services_grid, where: "Serviços", storage: post_type }
    - { target: projects_hero, where: "Configurações do Site > Serviços e Projetos", storage: options_page, fields: [projects_hero_title, projects_hero_text, projects_hero_image] }
    - { target: projects_filter, where: "Projetos > Categorias de Projeto; rótulo 'Todos' em Configurações do Site > Serviços e Projetos", storage: taxonomy, fields: [projects_filter_all_label] }
    - { target: projects_grid, where: "Projetos", storage: post_type }
    - { target: contact_form, where: "Páginas > Contato > Cabeçalho da página; formulário em Contato (CF7)", storage: form, fields: [page_hero_title, page_hero_text] }
    - { target: contact_info, where: "Configurações do Site > Empresa/Redes sociais", storage: options_page, fields: [company_phone, company_email, company_address_line1, company_address_line2, company_business_hours] }

  pages:
    - id: home
      slug: ""
      name: "Home"
      template: "front-page.php"
      status: approved
      sections:
        - { id: home_hero, component: hero, type: global, source: reference_file, order: 1, visibility: public }
        - { id: home_services, component: service_grid, type: dynamic, source: reference_file, order: 2, visibility: public }
        - { id: home_about, component: about_teaser, type: static, source: reference_file, order: 3, visibility: public }
        - { id: home_projects, component: project_grid, type: dynamic, source: reference_file, order: 4, visibility: public }
        - { id: home_testimonials, component: testimonial_grid, type: dynamic, source: reference_file, order: 5, visibility: public }
        - { id: home_cta, component: cta, type: global, source: reference_file, order: 6, visibility: public }

    - id: about
      slug: "sobre"
      name: "Sobre"
      template: "page.php"
      status: approved
      sections:
        - { id: about_hero, component: hero, type: static, source: reference_file, order: 1, visibility: public }
        - { id: about_content, component: rich_text, type: static, source: inference, order: 2, visibility: public }

    - id: services
      slug: "servicos"
      name: "Serviços"
      template: "archive-service.php"
      status: approved
      sections:
        - { id: services_hero, component: hero, type: static, source: reference_file, order: 1, visibility: public }
        - { id: services_grid, component: service_grid, type: dynamic, source: inference, order: 2, visibility: public }

    - id: projects
      slug: "projetos"
      name: "Projetos"
      template: "archive-project.php"
      status: approved
      sections:
        - { id: projects_hero, component: hero, type: static, source: reference_file, order: 1, visibility: public }
        - { id: projects_filter, component: category_filter, type: functional, source: reference_file, order: 2, visibility: public }
        - { id: projects_grid, component: project_grid, type: dynamic, source: inference, order: 3, visibility: public }

    - id: contact
      slug: "contato"
      name: "Contato"
      template: "page-contato.php"
      status: approved
      sections:
        - { id: contact_form, component: contact_form, type: functional, source: reference_file, order: 1, visibility: public }
        - { id: contact_info, component: contact_info, type: global, source: reference_file, order: 2, visibility: public }

  components:
    - { id: header, name: "Header", reusable: true, source: reference_file }
    - { id: footer, name: "Footer", reusable: true, source: reference_file }
    - { id: hero, name: "Hero", reusable: true, source: reference_file }
    - { id: cta, name: "CTA com botao de orcamento e WhatsApp", reusable: true, source: reference_file }
    - { id: service_grid, name: "Grid de servicos (3 cards)", reusable: true, source: reference_file }
    - { id: project_grid, name: "Grid de projetos com imagem+localizacao", reusable: true, source: reference_file }
    - { id: testimonial_grid, name: "Grid de depoimentos (3 cards)", reusable: true, source: reference_file }
    - { id: category_filter, name: "Filtro de categoria de projeto", reusable: true, source: reference_file }
    - { id: contact_form, name: "Formulario de contato", reusable: false, source: reference_file }

  content_types:
    - id: service
      name: "Servico"
      plural_name: "Serviços"
      wordpress: { type: custom_post_type, slug: service, public: true, has_archive: true, rewrite: { slug: "servicos" } }
      supports: ["title", "thumbnail"]   # imagem do card = thumbnail nativo (nao duplicar em campo)
      fields:
        - { id: service_icon, label: "Icone", type: text, required: false, source: reference_file, description: "Nome do icone Phosphor (ex.: house-line). Aparece no circulo sobre a foto do card." }
        - { id: service_short_description, label: "Descricao curta", type: textarea, required: true, source: reference_file, description: "Ate 2 linhas; aparece no card da Home e de Servicos." }
        - { id: service_detailed_description, label: "Descricao detalhada", type: rich_text, required: false, source: inference, description: "Texto da pagina do servico." }

    - id: project
      name: "Projeto"
      plural_name: "Projetos"
      wordpress: { type: custom_post_type, slug: project, public: true, has_archive: true, rewrite: { slug: "projetos" } }
      supports: ["title", "thumbnail"]   # imagem do card = thumbnail nativo
      fields:
        - { id: project_gallery, label: "Galeria", type: gallery, required: false, source: inference, description: "Fotos exibidas na pagina do projeto." }
        - { id: project_neighborhood, label: "Bairro", type: text, required: false, source: reference_file, description: "Opcional; exibido antes da cidade quando preenchido." }
        - { id: project_city, label: "Cidade", type: text, required: true, source: reference_file, description: "Aparece sob o titulo do card (ex.: Goiania)." }
        - { id: project_state, label: "UF", type: text, required: true, default: "GO", source: reference_file, description: "Sigla do estado, 2 letras." }
        - { id: project_description, label: "Descricao", type: rich_text, required: false, source: inference, description: "Texto da pagina do projeto." }
        - { id: project_completion_date, label: "Data de conclusao", type: date, required: false, source: inference, description: "Usada para ordenar do mais recente ao mais antigo." }
        - { id: project_client, label: "Cliente", type: text, required: false, source: inference, description: "Uso interno; nao exibido no card." }
        - { id: project_featured, label: "Destaque na Home", type: boolean, required: false, default: false, source: inference, description: "Marque para exibir na secao Projetos que inspiram da Home (ate 6)." }

    - id: testimonial
      name: "Depoimento"
      plural_name: "Depoimentos"
      wordpress: { type: custom_post_type, slug: testimonial, public: false, has_archive: false }
      supports: ["title"]
      fields:
        - { id: testimonial_client_name, label: "Nome do cliente", type: text, required: true, source: reference_file, description: "Nome exibido abaixo do depoimento." }
        - { id: testimonial_quote, label: "Depoimento", type: textarea, required: true, source: reference_file, description: "Ate ~200 caracteres para caber no card." }
        - { id: testimonial_client_photo, label: "Foto do cliente", type: image, required: false, source: reference_file, description: "Foto quadrada; exibida em circulo." }
        - { id: testimonial_location, label: "Cidade do cliente", type: text, required: false, source: reference_file, description: "Ex.: Goiania - GO." }
        - { id: testimonial_featured, label: "Destaque na Home", type: boolean, required: false, default: true, source: inference, description: "Exibe na Home (ate 3)." }

  taxonomies:
    - id: project_category
      name: "Categoria de Projeto"
      slug: "categoria-projeto"
      hierarchical: true
      post_types: ["project"]
      terms: ["casas", "reformas", "projetos"]

  global_settings:
    company:
      logo: "extrair do reference.png (marca 'Construtora Horizonte')"
      name: "Construtora Horizonte"
      phone: "(62) 99999-9999"
      whatsapp: "(62) 99999-9999"
      email: "contato@construtorahorizonte.com.br"
      address: "Rua das Palmeiras, 123 - Setor Bueno - Goiania - GO"
      business_hours: "Seg - Sex: 8h as 18h"
    social:
      instagram: "(icone presente no footer, URL nao informada)"
      facebook: "(icone presente no footer, URL nao informada)"
      youtube: "(icone presente no footer, URL nao informada)"
      linkedin: "(icone presente no footer, URL nao informada)"
    branding:
      primary_color: "#AA762A"
      secondary_color: "#15181B"
      site_icon: site_icon             # simbolo do logo (sem o nome) -> Icone do site (make_site_icon.py)
    cta:
      default_label: "Solicitar Orçamento"
      default_url: "#contato"

  menus:
    - id: primary
      name: "Menu Principal"
      location: "primary"
      items:
        - { label: "Início", target: "home", type: page }
        - { label: "Sobre", target: "sobre", type: page }
        - { label: "Serviços", target: "servicos", type: page }
        - { label: "Projetos", target: "projetos", type: page }
        - { label: "Contato", target: "contato", type: page }
    - id: footer
      name: "Links Rapidos"
      location: "footer"
      items:
        - { label: "Início", target: "home", type: page }
        - { label: "Sobre", target: "sobre", type: page }
        - { label: "Serviços", target: "servicos", type: page }
        - { label: "Projetos", target: "projetos", type: page }
        - { label: "Contato", target: "contato", type: page }

  # Conferido: a referencia nao tem carrossel (depoimentos em grid fixo de 3).
  carousels: []

  forms:
    - id: contact
      page: contact
      section: contact_form
      purpose: contact
      destination: "contato@construtorahorizonte.com.br"
      reply_to_field: contato_email
      subject_field: contato_assunto
      required_marker: "*"            # asterisco vermelho ao lado do rotulo, na referencia
      fields:
        - { name: contato_nome, type: text, label: "Nome", required: true, autocomplete: name }
        - { name: contato_email, type: email, label: "E-mail", required: true, autocomplete: email }
        - { name: contato_telefone, type: tel, label: "Telefone", required: false, autocomplete: tel }
        - { name: contato_assunto, type: select, label: "Assunto", placeholder: "Selecione...", required: false, options: ["Orçamento", "Dúvidas", "Outros"] }
        - { name: contato_mensagem, type: textarea, label: "Mensagem", required: true }
      submit_label: "Enviar Mensagem"
      submit_icon: true               # seta a direita do texto, na referencia
      privacy:
        notice: text
        text: "Ao enviar, você concorda com a nossa"
        link_text: "Política de Privacidade"
        policy_page: politica-de-privacidade
        shown_in_reference: false     # desvio intencional (LGPD), aprovado
      anti_spam: akismet

  # Conferido: a referencia nao tem mapa (o endereco aparece so em texto).
  maps: []

  # Conferido: a referencia nao tem galeria (projetos sao cards com titulo e
  # texto) nem video (nenhum botao play, duracao ou logo de provedor).
  galleries: []
  videos: []

  # Conferido: a referencia nao tem acordeao/FAQ nem abas.
  accordions: []
  tabs: []

  # Conferido: a referencia nao tem tabela de dados nem precos
  # (orcamento e sob consulta, via formulario).
  tables: []
  pricing: []

  # Depoimentos da referencia: nomes, fotos e falas sao do mockup -> demo
  # (o tema os oculta em producao) ate o cliente enviar os reais com autorizacao.
  testimonials:
    - id: home_testimonials
      section: home_testimonials
      layout: grid
      evidence: [quote_marks, quote_text, author_name, author_photo]
      item_count: 3
      fields_shown: [photo, city]
      content_source: demo
      consent:
      storage: "post_type:testimonial"

  # Conferido: a referencia nao tem logos de clientes/parceiros.
  client_logos: []

  # Conferido: a referencia nao tem bloco de equipe.
  team: []

  # "+10 anos / +150 projetos / 100% satisfeitos" (secao Sobre): afirmacoes
  # de negocio vindas do mockup -> demo ate o cliente confirmar os valores.
  stats:
    - id: home_about_stats
      section: home_about
      evidence: [big_number, prefix_suffix, label_below]
      item_count: 3
      count_up: false                # referencia estatica; animacao nao pedida
      content_source: demo
      storage: "repeater:about_stats"

  # Conferido: a referencia nao tem blog/noticias (nenhum card com data/categoria).
  blog:
    enabled: false

  # Hero da Home: foto de fundo, texto a esquerda (camada mais escura desse
  # lado), dois botoes. Paginas internas: faixa com foto, titulo e texto,
  # sem trilha de navegacao (a referencia nao mostra).
  heroes:
    - id: home_hero
      section: home_hero
      kind: background
      evidence: [full_bleed_image, text_over_image, headline, buttons]
      height: full
      overlay: 0.45
      mobile_image: focal            # ponto focal na fachada (sem referencia mobile)
      image_role: decorative         # o texto ja diz tudo; a foto e ambiente
      buttons:
        - { label: "Solicitar Orçamento", target: contato, style: primary }
        - { label: "Conhecer Projetos", target: projetos, style: secondary }
    - { id: about_hero, section: about_hero, kind: page_header, evidence: [page_title_band, full_bleed_image], breadcrumb: false, overlay: 0.5, mobile_image: focal, image_role: decorative, has_image: true }
    - { id: services_hero, section: services_hero, kind: page_header, evidence: [page_title_band, full_bleed_image], breadcrumb: false, overlay: 0.5, mobile_image: focal, image_role: decorative, has_image: true }
    - { id: projects_hero, section: projects_hero, kind: page_header, evidence: [page_title_band, full_bleed_image], breadcrumb: false, overlay: 0.5, mobile_image: focal, image_role: decorative, has_image: true }

  # Faixa "Vamos construir o seu projeto?" (foto escura, 2 botoes) - reutilizavel.
  banners:
    - id: home_cta
      kind: cta_band
      section: home_cta
      reusable: true
      buttons:
        - { label: "Solicitar Orçamento", target: contato, style: primary }
        - { label: "Falar no WhatsApp", target: "whatsapp", style: secondary }

  # Header da referencia: logo claro a esquerda, 5 itens (ativo sublinhado),
  # botao "Solicitar Orçamento", transparente sobre a foto do hero.
  # Menu mobile e estado rolado nao aparecem na imagem: decisoes registradas.
  header:
    evidence: [logo, nav, cta_button, transparent_over_hero]
    layout: logo_left
    cta: { label: "Solicitar Orçamento", target: contato }
    top_bar: []
    actions: []
    transparent: true
    logo_light: company_logo_light
    submenus: none
    mobile_menu: dropdown           # inferencia (sem referencia mobile)

  # Rodape da referencia: logo + texto + redes | Links Rapidos | Nossos
  # Servicos | Contato; faixa inferior com copyright, Politica de
  # Privacidade e Termos de Uso. Ano dinamico ({ano}) - o "2024" da
  # imagem e do mockup.
  footer:
    evidence: [columns, footer_menu, contact_block, social_icons, legal_row]
    columns:
      - { id: about, kind: about, social: true }
      - { id: links, kind: menu, title: "Links Rápidos" }
      - { id: services, kind: menu, title: "Nossos Serviços" }
      - { id: contact, kind: contact, title: "Contato" }
    copyright: "© {ano} {empresa}. Todos os direitos reservados."
    legal: { privacy_link: true, terms_link: true, cnpj: hidden }
    back_to_top: false
    credit: false

  # 5 icones no rodape; os 4 primeiros identificados. URLs nao informadas:
  # campos vazios no admin (icone so aparece quando preenchido).
  social:
    networks: [instagram, facebook, youtube, linkedin]
    locations: [footer]
    urls_source: pending

  media:
    - { id: logo, purpose: "Logo Construtora Horizonte (header e footer)", type: logo, treatment: crop_from_reference, source: placeholder, required: true, replace_before_launch: true }
    - { id: site_icon, purpose: "Simbolo do logo (casas) para o Icone do site - aba do navegador e atalho no celular", type: logo, treatment: crop_from_reference, source: placeholder, required: true, replace_before_launch: true }
    - { id: home_hero_photo, purpose: "Fachada noturna no hero da Home", page: home, section: home_hero, type: photo, treatment: crop_from_reference, source: placeholder, aspect_ratio: "3:2", object_fit: cover, required: true, replace_before_launch: true }
    - { id: service_photos, purpose: "Fotos dos cards de servico (thumbnail)", page: home, section: home_services, type: photo, treatment: crop_from_reference, source: placeholder, aspect_ratio: "3:2", object_fit: cover, required: true, replace_before_launch: true }
    - { id: service_icons, purpose: "Icones circulares dos cards de servico", page: home, section: home_services, type: icon, treatment: icon_library, source: external, required: true }
    - { id: project_photos, purpose: "Fotos dos cards de projeto (thumbnail)", page: home, section: home_projects, type: photo, treatment: crop_from_reference, source: placeholder, aspect_ratio: "3:2", object_fit: cover, required: true, replace_before_launch: true }
    - { id: testimonial_photos, purpose: "Fotos dos clientes nos depoimentos", page: home, section: home_testimonials, type: photo, treatment: placeholder, source: placeholder, aspect_ratio: "1:1", object_fit: cover, required: false, replace_before_launch: true }
    - { id: home_cta_background, purpose: "Fundo escuro com foto da secao CTA", page: home, section: home_cta, type: background, treatment: crop_from_reference, source: placeholder, aspect_ratio: "21:9", object_fit: cover, required: true, replace_before_launch: true }

  fonts:
    delivery: self_hosted              # arquivos no proprio site (scripts/fetch_fonts.py) - sem Google no navegador do visitante
    fallback_metrics: true             # reserva Arial ajustada: o texto nao pula quando a fonte chega
    families:
      - { family: Manrope, role: heading, weights: [600, 700, 800], source: google_fonts, license: OFL, preload: [700] }   # 700 = titulo do hero
      - { family: Inter, role: body, weights: [400, 500, 600], source: google_fonts, license: OFL, preload: [400] }

  seo:
    plugin: none                      # SEO do tema (inc/seo.php); yoast | rank_math | seopress | aioseo = tema se cala
    organization_type: GeneralContractor   # construtora com endereco fisico -> LocalBusiness (subtipo)
    share_image: home_hero_image       # imagem padrao ao compartilhar (1200x630, recorte do hero)
    ai_crawlers: block_training        # bloqueia treino de IA; o site continua citado nas buscas com IA (ChatGPT, Perplexity, Claude)
    ai_crawlers_source: user           # escolha do cliente na aprovacao
    pages:
      - { page: home, description_source: proposed, description: "Construtora Horizonte: obras residenciais e comerciais em Goiânia, do projeto à entrega das chaves, com prazo e transparência. Peça seu orçamento." }
      - { page: about, description_source: proposed, description: "Conheça a Construtora Horizonte: nossa história, a equipe e o jeito de construir com prazo, qualidade e transparência em Goiânia e região." }
      - { page: services, description_source: proposed, description: "Construção residencial e comercial, reformas e gerenciamento de obras em Goiânia. Veja os serviços da Construtora Horizonte e como trabalhamos." }
      - { page: projects, description_source: proposed, description: "Projetos da Construtora Horizonte em Goiânia: casas, edifícios e obras comerciais entregues, com fotos e a localização de cada obra." }
      - { page: contact, description_source: proposed, description: "Fale com a Construtora Horizonte: telefone, WhatsApp, e-mail e endereço em Goiânia. Envie sua mensagem e receba um orçamento sem compromisso." }

  launch:
    domain: null                       # dominio final - perguntar antes da publicacao (go_live.py --domain)

  redirects:
    old_site: null                     # o cliente nao tem site hoje; se tiver: URL + build_redirects.py --suggest
    map: []

  security:
    hardening: standard                # mu-plugin project-hardening + .htaccess do scaffold
    exceptions: []                     # nenhuma integracao exige XML-RPC, pagina de autor ou iframe externo

  plugins:
    required:
      - { name: "Advanced Custom Fields PRO", purpose: "Todo o conteúdo editável no admin: páginas de opções, campos da Home e das páginas, campos dos CPTs, repeater de números", reason: "Necessário para o administrador alterar qualquer texto ou imagem do site sem mexer em código (decisão v0.3)", source: system }
      - { name: "Contact Form 7", purpose: "Formulario de contato", reason: "Padrao deste ambiente para formularios de contato", source: system }
    optional: []
    prohibited: []

  theme:
    name: "Construtora Horizonte Theme"
    slug: "construtora-horizonte-theme"
    type: classic
    header_behavior: static
    header_scrolled: "fundo #14171C (secundaria) com logo claro - decisao: a referencia so mostra o header sobre o hero"
    supports: ["title-tag", "post-thumbnails"]
    structure:
      templates: ["front-page.php", "page.php", "archive-service.php", "archive-project.php", "single-service.php", "single-project.php", "page-contact.php"]
      template_parts: ["hero", "service-card", "project-card", "testimonial-card", "cta", "category-filter"]

  responsive:
    reference_available: false
    breakpoints: { desktop: "1200px+", tablet: "768px-1199px", mobile: "<768px" }
    note: "Nenhuma referencia mobile foi fornecida; comportamento mobile sera inferido conforme references/responsive-guidelines.md e validado visualmente apos implementacao."

  accessibility: {}

  integrations:
    - { service: "WhatsApp", purpose: "Botao 'Falar no WhatsApp' no CTA", enabled: true, authorization: "layout mostra o botao explicitamente", configuration_needed: "numero de WhatsApp real a confirmar" }

  decisions:
    - id: D001
      subject: "Modelagem de servicos"
      decision: "Criar CPT Service"
      reason: "Servicos sao conteudo repetitivo (3 cards) com campos estruturados (icone, descricao) e candidatos a administracao futura"
      source: inference
      confidence: high
      status: approved
      affects: ["theme", "content_types"]
    - id: D002
      subject: "Modelagem de projetos"
      decision: "Criar CPT Project + taxonomia Project Category"
      reason: "6+ projetos com campos proprios (localizacao, imagem) e filtro por categoria explicito no layout"
      source: layout
      confidence: high
      status: approved
      affects: ["theme", "content_types", "taxonomies"]
    - id: D003
      subject: "Modelagem de depoimentos"
      decision: "Criar CPT Testimonial (sem archive/single publico)"
      reason: "3 depoimentos com estrutura propria (nome, foto, citacao), mas sem evidencia de pagina individual - usado apenas via query na Home"
      source: inference
      confidence: medium
      status: approved
      affects: ["content_types"]
    - id: D004
      subject: "Dados globais"
      decision: "Centralizar telefone, WhatsApp, endereco, horario e redes sociais em ACF Options Page"
      reason: "Esses dados aparecem no header/footer/contato; devem ter fonte unica"
      source: best_practice
      confidence: high
      status: approved
      affects: ["global_settings", "theme"]
    - id: D005
      subject: "Tema"
      decision: "Tema classico (nao bloco/FSE)"
      reason: "Padrao deste ambiente para controle preciso de HTML/CSS/templates"
      source: user
      confidence: high
      status: approved
      affects: ["theme"]
    - id: D006
      subject: "Posicao da secao de Depoimentos e do CTA final"
      decision: "Exibir Depoimentos e CTA final apenas na Home (nao replicar em Projetos)"
      reason: "A referencia mostra as duas secoes uma unica vez no mosaico; sem evidencia clara de que aparecem em mais de uma pagina, assume-se Home por ser o padrao mais comum. Baixo impacto arquitetural (apenas posicionamento, nao modelagem)."
      source: inference
      confidence: medium
      status: approved
      affects: ["pages"]

  uncertainties:
    - id: u_social_5
      subject: social
      question: "O 5º ícone de rede no rodapé (círculo com símbolo) é de qual rede? Ilegível na referência."
      impact: low
      blocking: false
      status: pending
    - id: U001
      subject: "Comportamento do filtro de projetos"
      question: "O filtro de categoria na pagina Projetos (Todos/Casas/Reformas/Projetos) deve recarregar a pagina ou filtrar via AJAX sem reload?"
      options: ["reload (mais simples, sem JS)", "ajax (mais fluido, requer JS/REST)"]
      impact: medium
      blocking: false
      status: resolved
      resolution: "Usuario escolheu reload (query_var de categoria via link, sem JavaScript)."
    - id: U002
      subject: "Numero de WhatsApp real"
      question: "O numero (62) 99999-9999 mostrado no layout e um numero real de WhatsApp Business para o botao 'Falar no WhatsApp', ou e placeholder de design?"
      options: []
      impact: medium
      blocking: false
      status: resolved
      resolution: "Construtora Horizonte e uma empresa ficticia definida como caso de teste desta Skill (ver examples/construtora-horizonte/case.md); os dados de contato do mockup sao, por definicao, conteudo demo, nao dados reais de uma empresa existente. Mantidos como estao e marcados como demo em VALIDATION.md - nao e uma incerteza real neste caso de teste especifico."
    - id: U003
      subject: "Paginas individuais"
      question: "Cada projeto e cada servico devem ter pagina propria (single), ou os cards apenas exibem informacao no proprio grid (sem link para detalhe)? O layout nao mostra claramente um estado de hover/link nos cards."
      options: ["projeto e servico com single", "apenas projeto com single", "nenhum com single"]
      impact: high
      blocking: false
      status: resolved
      resolution: "Usuario escolheu: projeto e servico com pagina propria (single-project.php e single-service.php)."
    - id: U004
      subject: "Redes sociais - URLs reais"
      question: "Os icones de Instagram/Facebook/YouTube/LinkedIn no footer tem URLs reais para vincular?"
      options: []
      impact: low
      blocking: false
      status: pending

  dependencies:
    - { id: DEP01, from: "implementation", depends_on: "wp-cli disponivel no WAMP", reason: "Scaffolding automatizado do projeto", type: tooling }
    - { id: DEP02, from: "plugins.required", depends_on: "licenca ACF PRO ja disponivel neste ambiente", reason: "Campos repeater/gallery/relationship", type: licensing }

  implementation:
    strategy: "Classic theme + ACF PRO + CPTs nativos"
    wordpress: { version_constraint: ">=6.4", php_version_constraint: ">=8.1" }
    theme: { type: classic, slug: "construtora-horizonte-theme" }
    content_model: { strategy: "custom_post_types_plus_acf_pro" }
    custom_fields: { provider: acf_pro }
    dependencies: ["DEP01", "DEP02"]
    generation_order:
      - environment_validation
