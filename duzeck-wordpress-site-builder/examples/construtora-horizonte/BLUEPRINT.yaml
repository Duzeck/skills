      - theme_structure
      - theme_bootstrap
      - post_types
      - taxonomies
      - custom_fields
      - global_settings
      - menus
      - pages
      - templates
      - template_parts
      - assets
      - demo_content
      - configuration
      - permalinks
      - functional_tests
      - visual_validation
    filesystem: { target: "C:/wamp64/www/construtora-horizonte", writable: true }
    configuration: { required: ["ACF PRO zip local"] }

  validation:
    architecture: { status: "pending", checks: [] }
    functionality: { status: "pending", checks: [] }
    content: { status: "pending", checks: [] }
    navigation: { status: "pending", checks: [] }
    forms: { status: "pending", checks: [] }
    responsive: { status: "pending", checks: [] }
    accessibility: { status: "pending", checks: [] }
    performance: { status: "pending", checks: [] }
    security: { status: "pending", checks: [] }
    visual: { status: "pending", checks: [] }

  generation:
    status: "not_started"
    target: { environment: local }
    wordpress: { required: true }
    output:
      theme: { required: true }
